services:
  - type: web
    name: motorhometools
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ASK_NOTIFY_EMAIL
        sync: false
      - key: ASK_LOG_PATH
        sync: false
